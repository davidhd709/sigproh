name: CI/CD SIGPROH

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sigproh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilar API y frontend
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm
    services:
      # Base desechable para comprobar que el API arranca igual que en el VPS
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sigproh_ci
          POSTGRES_USER: sigproh_ci
          POSTGRES_PASSWORD: sigproh_ci
        options: >-
          --health-cmd "pg_isready -U sigproh_ci -d sigproh_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        working-directory: apps/api
        run: npx prisma generate --config prisma7.config.ts

      - name: Compilar API
        run: npm run build:api

      # La compilación no detecta incompatibilidades entre paquetes que solo fallan al
      # cargar los módulos (p. ej. @nestjs/core y @nestjs/common en versiones distintas).
      - name: Arrancar API (prueba de humo)
        working-directory: apps/api
        env:
          NODE_ENV: production
          PORT: "3000"
          DATABASE_URL: postgresql://sigproh_ci:sigproh_ci@postgres:5432/sigproh_ci?schema=public
          JWT_ACCESS_SECRET: ci-smoke-test-only
          STORAGE_PATH: /tmp/sigproh-uploads
        run: |
          set -Eeuo pipefail
          npx prisma migrate deploy --config prisma7.config.ts
          node dist/main.js > /tmp/api-smoke.log 2>&1 &
          API_PID=$!
          for _ in $(seq 1 30); do
            if node -e "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              echo "El API arrancó y responde en /"
              kill "$API_PID"
              exit 0
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "::error::El API se detuvo al arrancar"
              cat /tmp/api-smoke.log
              exit 1
            fi
            sleep 2
          done
          echo "::error::El API no respondió en 60 segundos"
          cat /tmp/api-smoke.log
          kill "$API_PID" || true
          exit 1

      - name: Compilar frontend
        run: npm run build:web

  publish-and-deploy:
    name: Publicar imágenes y desplegar en VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: write
    concurrency:
      group: sigproh-production-deploy
      cancel-in-progress: false
    steps:
      - name: Obtener código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Iniciar sesión en GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Construir y publicar imágenes
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          IMAGE_PREFIX="${IMAGE_PREFIX,,}"

          docker build --pull \
            --file apps/api/Dockerfile \
            --tag "$IMAGE_PREFIX-api:$IMAGE_TAG" \
            --tag "$IMAGE_PREFIX-api:latest" .
          docker push "$IMAGE_PREFIX-api:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX-api:latest"

          docker build --pull \
            --file apps/web/Dockerfile \
            --tag "$IMAGE_PREFIX-web:$IMAGE_TAG" \
            --tag "$IMAGE_PREFIX-web:latest" .
          docker push "$IMAGE_PREFIX-web:$IMAGE_TAG"
          docker push "$IMAGE_PREFIX-web:latest"

      - name: Desplegar por SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          set -Eeuo pipefail

          : "${VPS_HOST:?Configura el secreto VPS_HOST}"
          : "${VPS_USER:?Configura el secreto VPS_USER}"
          : "${VPS_SSH_PORT:?Configura el secreto VPS_SSH_PORT}"
          : "${VPS_SSH_PRIVATE_KEY:?Configura el secreto VPS_SSH_PRIVATE_KEY}"
          : "${VPS_KNOWN_HOSTS:?Configura el secreto VPS_KNOWN_HOSTS}"
          : "${VPS_DEPLOY_PATH:?Configura el secreto VPS_DEPLOY_PATH}"
          : "${GHCR_USERNAME:?Configura el secreto GHCR_USERNAME}"
          : "${GHCR_READ_TOKEN:?Configura el secreto GHCR_READ_TOKEN}"

          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.:-]+$ ]]
          [[ "$VPS_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]]
          [[ "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          (( VPS_SSH_PORT > 0 && VPS_SSH_PORT < 65536 ))
          [[ "$VPS_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9-]+$ ]]

          SSH_KEY="$RUNNER_TEMP/sigproh_deploy_key"
          KNOWN_HOSTS_FILE="$RUNNER_TEMP/sigproh_known_hosts"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$SSH_KEY"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$KNOWN_HOSTS_FILE"
          chmod 600 "$SSH_KEY" "$KNOWN_HOSTS_FILE"

          DESTINATION="$VPS_USER@$VPS_HOST"
          SSH_OPTIONS=(-p "$VPS_SSH_PORT" -i "$SSH_KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE")
          SCP_OPTIONS=(-P "$VPS_SSH_PORT" -i "$SSH_KEY" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$KNOWN_HOSTS_FILE")
          REGISTRY_LOGIN=false

          cleanup() {
            if [[ "$REGISTRY_LOGIN" == true ]]; then
              ssh "${SSH_OPTIONS[@]}" "$DESTINATION" "docker logout ghcr.io >/dev/null 2>&1 || true" || true
            fi
            rm -f "$SSH_KEY" "$KNOWN_HOSTS_FILE"
          }
          trap cleanup EXIT

          ssh "${SSH_OPTIONS[@]}" "$DESTINATION" "mkdir -p -- '$VPS_DEPLOY_PATH'"
          scp "${SCP_OPTIONS[@]}" docker-compose.production.yml .env.production.example scripts/deploy-vps.sh "$DESTINATION:$VPS_DEPLOY_PATH/"

          printf '%s' "$GHCR_READ_TOKEN" | ssh "${SSH_OPTIONS[@]}" "$DESTINATION" \
            "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
          REGISTRY_LOGIN=true

          ssh "${SSH_OPTIONS[@]}" "$DESTINATION" \
            "cd '$VPS_DEPLOY_PATH' && bash ./deploy-vps.sh '$GITHUB_SHA'"
