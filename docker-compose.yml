services:
  postgres:
    image: postgres:18-alpine
    container_name: sigproh-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: sigproh
      POSTGRES_USER: sigproh
      POSTGRES_PASSWORD: sigproh_dev_password
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - sigproh_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigproh -d sigproh"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sigproh_postgres_data: